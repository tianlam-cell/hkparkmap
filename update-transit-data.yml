name: Update transit data

on:
  schedule:
    - cron: '0 20 * * *'   # 每日 04:00（香港時間）
  workflow_dispatch:        # 可在 Actions 頁面手動執行

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build transit-data.json
        run: node scripts/build-transit-data.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add transit-data.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update transit-data.json"
            git push
          fi

      - name: Trigger GitHub Pages build (best effort)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build trigger skipped"
